<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vérification email — RovixBall</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <span class="logo">⚽</span>
      <h1>ROVIXBALL</h1>
    </header>

    <main>
      <h1>Vérification de l'email</h1>
      <p class="meta">Confirme ton adresse pour activer ton compte.</p>

      <div class="card" id="status-card">
        <p id="status-msg">⏳ Vérification en cours…</p>
        <pre id="debug" style="display:none; margin-top:12px; padding:10px; background:#000; color:#f8fafc; font-size:11px; overflow-x:auto; border-radius:6px;"></pre>
      </div>

      <p style="text-align:center; margin-top: 32px; color: var(--text-muted); font-size: 13px;">
        Retourne dans l'application RovixBall après vérification.
      </p>
    </main>

    <footer>
      © FVO Studio · RovixBall
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/appwrite@16.0.2"></script>
  <script>
    const ENDPOINT = 'https://fra.cloud.appwrite.io/v1';
    const PROJECT_ID = '6a063d410032ed1598b1';

    const params = new URLSearchParams(window.location.search);
    const userId = params.get('userId');
    const secret = params.get('secret');
    const card = document.getElementById('status-card');
    const msg = document.getElementById('status-msg');
    const debug = document.getElementById('debug');

    function setStatus(html, kind) {
      msg.innerHTML = html;
      card.className = 'card' + (kind === 'ok' ? '' : kind === 'warn' ? ' warn' : ' danger');
    }
    function showDebug(text) {
      debug.style.display = 'block';
      debug.textContent = text;
    }

    if (typeof Appwrite === 'undefined') {
      setStatus(
        "❌ <strong>Le SDK Appwrite n'a pas pu se charger.</strong><br><br>Vérifie ta connexion internet et recharge la page.",
        'danger'
      );
    } else if (!userId || !secret) {
      setStatus(
        "❌ Lien invalide ou expiré.<br><br>userId : " +
          (userId || '(absent)') +
          "<br>secret : " +
          (secret ? '(présent)' : '(absent)') +
          "<br><br>Retourne dans l'app et redemande un email de vérification.",
        'danger'
      );
    } else {
      try {
        const client = new Appwrite.Client();
        client.setEndpoint(ENDPOINT).setProject(PROJECT_ID);
        const account = new Appwrite.Account(client);

        // Appwrite Web SDK v16+ uses object-style params
        account
          .updateVerification({ userId: userId, secret: secret })
          .then(function () {
            setStatus(
              "✅ <strong>Compte vérifié avec succès !</strong><br><br>Tu peux maintenant retourner dans l'application RovixBall et appuyer sur le bouton <em>«&nbsp;J'AI VÉRIFIÉ — CONTINUER&nbsp;»</em>.",
              'ok'
            );
          })
          .catch(function (err) {
            // Fallback: try the positional signature in case the SDK is older
            account
              .updateVerification(userId, secret)
              .then(function () {
                setStatus(
                  "✅ <strong>Compte vérifié avec succès !</strong><br><br>Retourne dans l'app RovixBall et continue.",
                  'ok'
                );
              })
              .catch(function (err2) {
                const m1 = err && err.message ? err.message : String(err);
                const m2 = err2 && err2.message ? err2.message : String(err2);
                setStatus(
                  "❌ <strong>Échec de la vérification.</strong><br><br>" +
                    m2 +
                    "<br><br>Retourne dans l'app et redemande un nouvel email de vérification.",
                  'danger'
                );
                showDebug(
                  '[object call] ' + m1 + '\n[positional fallback] ' + m2,
                );
              });
          });
      } catch (e) {
        setStatus(
          "❌ <strong>Erreur d'initialisation du SDK.</strong><br><br>" +
            (e && e.message ? e.message : String(e)),
          'danger'
        );
      }
    }
  </script>
</body>
</html>
