<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Réinitialiser mot de passe — RovixBall</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <span class="logo">⚽</span>
      <h1>ROVIXBALL</h1>
    </header>

    <main>
      <h1>Réinitialiser mon mot de passe</h1>
      <p class="meta">Choisis un nouveau mot de passe (8 caractères minimum).</p>

      <div class="card" id="form-card">
        <form id="form" style="display:flex; flex-direction:column; gap:14px;">
          <label style="color: var(--text-dim); font-size: 13px; font-weight: 700;">
            Nouveau mot de passe
            <input
              id="pw1"
              type="password"
              required
              minlength="8"
              autocomplete="new-password"
              style="width: 100%; margin-top: 6px; padding: 12px 14px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 14px;"
            />
          </label>
          <label style="color: var(--text-dim); font-size: 13px; font-weight: 700;">
            Confirme le mot de passe
            <input
              id="pw2"
              type="password"
              required
              minlength="8"
              autocomplete="new-password"
              style="width: 100%; margin-top: 6px; padding: 12px 14px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 14px;"
            />
          </label>
          <button
            type="submit"
            id="submit-btn"
            style="margin-top: 8px; padding: 14px; background: var(--accent); color: var(--bg); border: 0; border-radius: 10px; font-weight: 900; letter-spacing: 2px; cursor: pointer;"
          >
            CHANGER MON MOT DE PASSE
          </button>
        </form>
        <p id="status-msg" style="margin-top: 16px; text-align: center; color: var(--text-dim);"></p>
      </div>

      <p style="text-align:center; margin-top: 32px; color: var(--text-muted); font-size: 13px;">
        Une fois le mot de passe changé, retourne dans l'application RovixBall pour te connecter.
      </p>
    </main>

    <footer>
      © FVO Studio · RovixBall
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/appwrite@16.0.2"></script>
  <script>
    const ENDPOINT = 'https://fra.cloud.appwrite.io/v1';
    const PROJECT_ID = '6a063d410032ed1598b1';

    const params = new URLSearchParams(window.location.search);
    const userId = params.get('userId');
    const secret = params.get('secret');
    const form = document.getElementById('form');
    const card = document.getElementById('form-card');
    const status = document.getElementById('status-msg');
    const submit = document.getElementById('submit-btn');

    if (!userId || !secret) {
      form.style.display = 'none';
      status.innerHTML = '❌ Lien invalide ou expiré. Retourne dans l\'app et redemande un email de récupération.';
      status.style.color = '#fca5a5';
      card.className = 'card danger';
    } else {
      const client = new Appwrite.Client().setEndpoint(ENDPOINT).setProject(PROJECT_ID);
      const account = new Appwrite.Account(client);

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const pw1 = document.getElementById('pw1').value;
        const pw2 = document.getElementById('pw2').value;
        if (pw1.length < 8) {
          status.textContent = '❌ 8 caractères minimum.';
          status.style.color = '#fca5a5';
          return;
        }
        if (pw1 !== pw2) {
          status.textContent = '❌ Les mots de passe ne correspondent pas.';
          status.style.color = '#fca5a5';
          return;
        }
        submit.disabled = true;
        submit.textContent = '⏳ EN COURS…';
        status.textContent = '';
        try {
          await account.updateRecovery(userId, secret, pw1);
          form.style.display = 'none';
          status.innerHTML = '✅ <strong>Mot de passe changé !</strong><br><br>Retourne dans l\'app RovixBall et connecte-toi avec ton nouveau mot de passe.';
          status.style.color = '#22c55e';
          card.className = 'card';
        } catch (err) {
          const msg = err && err.message ? err.message : 'Erreur inconnue';
          status.innerHTML = '❌ ' + msg;
          status.style.color = '#fca5a5';
          submit.disabled = false;
          submit.textContent = 'CHANGER MON MOT DE PASSE';
        }
      });
    }
  </script>
</body>
</html>
